tags:
  - Contacts
summary: Створити новий контакт (з можливістю завантажити фото)
operationId: createContact
description: Додає новий контакт. Підтримує multipart/form-data для завантаження фото.
security: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            example: 'Alice'
          phoneNumber:
            type: string
            example: '+380991234567'
          email:
            type: string
            format: email
            example: 'alice@example.com'
          isFavourite:
            type: boolean
            example: false
          contactType:
            type: string
            enum: [work, home, personal]
            example: 'work'
          photo:
            type: string
            format: binary
            description: 'JPEG/PNG file for contact photo'
responses:
  '201':
    description: Контакт створено
    content:
      application/json:
        schema:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
            phoneNumber:
              type: string
            email:
              type: string
            photo:
              type: string
  '400':
    description: Некоректні дані
