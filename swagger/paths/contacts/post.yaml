tags:
  - Contacts
summary: Створити новий контакт
operationId: createContact
description: Створює новий контакт користувача
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - phone
        properties:
          name:
            type: string
            example: 'Bob Marley'
          email:
            type: string
            example: bob@example.com
          phone:
            type: string
            example: '+380991112233'
responses:
  '201':
    description: Контакт створено
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
