tags:
  - Contacts
summary: Створити новий контакт
operationId: createContact
description: Додає новий контакт. Підтримує завантаження фото через multipart/form-data.
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            example: 'Alice Johnson'
          phoneNumber:
            type: string
            example: '+380991234567'
          email:
            type: string
            format: email
            example: 'alice@example.com'
          isFavourite:
            type: boolean
            example: false
          contactType:
            type: string
            enum: [work, home, personal]
            example: 'work'
          photo:
            type: string
            format: binary
            description: 'Зображення контакту (JPEG/PNG)'
responses:
  '201':
    description: Контакт успішно створено
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Contact.yaml
  '400':
    description: Некоректні дані
