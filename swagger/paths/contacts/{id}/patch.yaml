tags:
  - Contacts
summary: Оновити контакт
operationId: updateContact
description: Оновлює контакт (частково). Підтримує multipart/form-data для оновлення фото.
security: []
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
requestBody:
  required: false
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'Updated Name'
          phoneNumber:
            type: string
            example: '+380991112233'
          email:
            type: string
            format: email
            example: 'test@example.com'
          isFavourite:
            type: boolean
          contactType:
            type: string
            enum: [work, home, personal]
          photo:
            type: string
            format: binary
            description: 'New photo file (optional)'
responses:
  '200':
    description: Контакт оновлено
  '400':
    description: Некоректні дані
