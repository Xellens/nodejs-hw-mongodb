tags:
  - Contacts
summary: Оновити контакт
operationId: updateContact
description: Оновлює дані контакту
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 65e4decdd286b30065d54af9
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
          email:
            type: string
          phone:
            type: string
responses:
  '200':
    description: Контакт оновлено
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/contact.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
