tags:
  - Contacts
summary: Оновити контакт
operationId: updateContact
description: >
  Оновлює дані контакту за ID. Підтримує оновлення фото через multipart/form-data.
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '60a7f1c2e1234567890abcdef'
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'Updated Name'
          phoneNumber:
            type: string
            example: '+380991112233'
          email:
            type: string
            format: email
            example: 'updated@example.com'
          isFavourite:
            type: boolean
            example: false
          contactType:
            type: string
            enum: [work, home, personal]
            example: 'home'
          photo:
            type: string
            format: binary
            description: 'Новий файл для зображення контакту (опційно)'
responses:
  '200':
    description: Контакт успішно оновлено
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/Contact.yaml'
  '400':
    description: Некоректні дані
