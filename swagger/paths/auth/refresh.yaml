tags:
  - Auth
summary: Оновлення токена
operationId: refreshToken
description: Оновлення access-токена за допомогою refresh-токена
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          refreshToken:
            type: string
        required:
          - refreshToken
responses:
  '200':
    description: Новий access-токен
  '403':
    description: Невалідний або прострочений токен
