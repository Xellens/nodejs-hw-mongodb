tags:
  - Auth
summary: Авторизація користувача
operationId: loginUser
description: Вхід користувача по email та паролю
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            example: user@example.com
          password:
            type: string
            example: mySecurePassword123
responses:
  '200':
    description: Авторизація успішна
  '401':
    $ref: ../../components/responses/401.yaml
