tags:
  - Auth
summary: Скидання паролю
operationId: sendResetEmail
description: Надсилає email з посиланням на скидання паролю
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            type: string
            example: user@example.com
responses:
  '200':
    description: Email з інструкціями надіслано
  '404':
    description: Користувача з таким email не знайдено
