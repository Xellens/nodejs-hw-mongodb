tags:
  - Auth
summary: Реєстрація нового користувача
operationId: registerUser
description: Реєстрація користувача по email та паролю
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            example: user@example.com
          password:
            type: string
            example: mySecurePassword123
responses:
  '201':
    description: Користувача успішно зареєстровано
  '400':
    description: Email вже використовується
