type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
properties:
  _id:
    type: string
    example: '60a7f1c2e1234567890abcdef'
  name:
    type: string
    example: 'Alice Johnson'
  phoneNumber:
    type: string
    example: '+380991234567'
  email:
    type: string
    example: 'alice@example.com'
  isFavourite:
    type: boolean
    example: false
  contactType:
    type: string
    enum: [work, home, personal]
    example: 'work'
  photo:
    type: string
    description: 'URL до завантаженого зображення'
    example: 'https://res.cloudinary.com/your_cloud_name/image/upload/v1623456789/sample.jpg'
  createdAt:
    type: string
    format: date-time
    example: '2025-04-15T12:34:56.789Z'
